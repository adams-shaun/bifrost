<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100" role="img" aria-label="SHAUNFROST">
  <defs>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- left snowflake glyph -->
  <g transform="translate(24 34)" stroke="url(#frost)" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="-18" y1="0" x2="18" y2="0"/>
    <line x1="0" y1="-18" x2="0" y2="18"/>
    <line x1="-12.7" y1="-12.7" x2="12.7" y2="12.7"/>
    <line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7"/>
    <circle cx="0" cy="0" r="3.75" fill="url(#frost)" stroke="none"/>
  </g>
  <!-- right snowflake glyph -->
  <g transform="translate(236 34)" stroke="url(#frost)" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="-18" y1="0" x2="18" y2="0"/>
    <line x1="0" y1="-18" x2="0" y2="18"/>
    <line x1="-12.7" y1="-12.7" x2="12.7" y2="12.7"/>
    <line x1="-12.7" y1="12.7" x2="12.7" y2="-12.7"/>
    <circle cx="0" cy="0" r="3.75" fill="url(#frost)" stroke="none"/>
  </g>
  <!-- SHAUN on the top line, flanked by the snowflakes -->
  <text x="56" y="48"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="39"
        letter-spacing="2.25"
        fill="url(#frost)"
        filter="url(#glow)">SHAUN</text>
  <!-- FROST stacked below, indented to nest under SHAUN -->
  <text x="76" y="90"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="39"
        letter-spacing="2.25"
        fill="url(#frost)"
        filter="url(#glow)">FROST</text>
</svg>
